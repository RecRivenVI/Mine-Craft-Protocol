// Scenario inputs on the template-generated isolated validation run, not daily client configuration.
gradle.projectsEvaluated {
    def target = System.getProperty('showcase.target')
    if (target == null || gradle.rootProject.name != 'Mine-Craft-Protocol') return
    def directory = System.getProperty('showcase.directory')
    def port = System.getProperty('showcase.port')
    if (!(target in ['1.20.1-forge', '26.3-fabric']) || !directory || !port)
        throw new GradleException('Explicit showcase target, directory and port required')
    def expected = gradle.rootProject.file("validations/feature-control_ui_showcase/instance/${target}/client")
    if (new File(directory).canonicalFile != expected.canonicalFile)
        throw new GradleException('Showcase directory is outside its validation instance')
    def candidate = gradle.rootProject.project(":version:${target}")
    def extension = candidate.extensions.findByName('loom') ?: candidate.extensions.getByName('legacyForge')
    def run = extension.runs.getByName('validationFeatureControlUiShowcaseClient')
    run.jvmArguments.add("-Dminecraft.protocol.probe.port=${port}".toString())
    gradle.rootProject.tasks.register('verifyShowcaseConfiguration') {
        group = 'verification'
        doLast {
            def actual = target.endsWith('-fabric') ? run.runDirectory.get().asFile : run.gameDirectory.get().asFile
            assert actual.canonicalFile == expected.canonicalFile
            assert run.jvmArguments.get().contains("-Dminecraft.protocol.probe.port=${port}".toString())
            assert run.jvmArguments.get().contains('-Dminecraft.protocol.showcaseFixture=true')
            logger.lifecycle('SHOWCASE_CONFIGURATION: PASS (template validation run; no daily configuration override; no launch)')
        }
    }
}
