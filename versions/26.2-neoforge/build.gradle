plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'io.netty:netty-codec-http:4.2.15.Final'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

tasks.named('test').configure {
    useJUnitPlatform()
}

def targetProperties = new Properties()
file('target.properties').withInputStream { targetProperties.load(it) }
targetProperties.each { key, value -> project.ext.set(key.toString(), value) }

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def vulkanFmlConfig = rootProject.file('runs/26.2-neoforge/client-vulkan/config/fml.toml')
def prepareVulkanFmlConfig = tasks.register('prepareVulkanFmlConfig') {
    outputs.file(vulkanFmlConfig)
    doLast {
        vulkanFmlConfig.parentFile.mkdirs()
        vulkanFmlConfig.setText('earlyWindowControl = false\n', 'UTF-8')
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('../../runs/26.2-neoforge/client')
            systemProperty 'minecraft.protocol.probe.disablePauseOnLostFocus', 'true'
            if (project.hasProperty('mcpQuickPlayServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('mcpQuickPlayServer').toString()
            }
        }
        clientVulkan {
            client()
            gameDirectory = file('../../runs/26.2-neoforge/client-vulkan')
            programArguments.addAll '--graphicsBackend', 'vulkan'
            systemProperty 'minecraft.protocol.probe.disablePauseOnLostFocus', 'true'
            taskBefore prepareVulkanFmlConfig
        }
        server {
            server()
            gameDirectory = file('../../runs/26.2-neoforge/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('runClientVulkan').configure {
    dependsOn prepareVulkanFmlConfig
}

processResources {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_description', project.mod_description
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.mod_version, 'mod_description': project.mod_description
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
