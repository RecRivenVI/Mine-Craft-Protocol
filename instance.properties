# Repository instance defaults. Missing memory/width/height/playerName retain
# Loader defaults; no arbitrary heap, window size or primary identity is invented.
# extraJvmArgs / extraGameArgs are JSON arrays of strings. Empty value means [].
# These flags preserve the existing client and server launch behavior.
instance.client.extraJvmArgs=["-Dminecraft.protocol.probe.disablePauseOnLostFocus=true"]
instance.client-multiplayer.extraJvmArgs=["-Dminecraft.protocol.probe.disablePauseOnLostFocus=true"]
instance.server.extraGameArgs=["--nogui"]

# Specificity within EACH file: Target+Variant > Target > Variant > Global.
# Resolve this file first, then local.properties; any applicable local value wins.
# The new second-client profile requires an explicit distinct playerName before
# launch, so two Loader-default "Dev" identities cannot silently collide.
# Example local keys (not active repository defaults):
# instance.client-multiplayer.playerName=SecondTester
# instance.[26.2-fabric].client.memory=4G
# instance.[26.2-fabric].width=1280
# instance.extraGameArgs=[]
