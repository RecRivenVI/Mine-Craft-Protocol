[versions]
foojay = "1.0.0"
# Spotless 8.10.4 still expects JavaFormatterOptions.Style to be an enum.
google-java-format = "1.36.1"
junit = "6.1.3"
ktfmt = "0.65"
loom = "1.18.3"
moddev = "2.0.148"
rumdl = "0.2.79"
spotless = "8.10.4"
tomlj = "2.2.0"
mcp-junit = "6.1.3"
mcp-junit-launcher = "6.1.3"
gson = "2.14.0"
mixin = "0.8.7"
openapi = "7.26.0"
mcp-netty = "4.1.82.Final"
mcp-runtime-gson = "2.10"

[libraries]
foojay-plugin = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
loom-plugin = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
moddev-plugin = { module = "net.neoforged:moddev-gradle", version.ref = "moddev" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
mcp-junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "mcp-junit" }
mcp-junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "mcp-junit-launcher" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
mixin-processor = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mcp-netty-http = { module = "io.netty:netty-codec-http", version.ref = "mcp-netty" }
mcp-netty-handler = { module = "io.netty:netty-handler", version.ref = "mcp-netty" }
mcp-runtime-gson = { module = "com.google.code.gson:gson", version.ref = "mcp-runtime-gson" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
openapi = { id = "org.openapi.generator", version.ref = "openapi" }
