name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: components/companion/package.json
          cache: npm
          cache-dependency-path: components/companion/package-lock.json
      - name: Install Companion dependencies
        working-directory: components/companion
        run: npm ci --include=dev
      - name: Check
        shell: pwsh
        run: |
          ./components/validation_tools/feature-control_ui_showcase/task/Prepare-AcceptanceInputs.ps1 -CacheDirectory "$env:RUNNER_TEMP/acceptance-inputs"
          ./gradlew check verifyRelease --continue
      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-report
          path: build/reports/compliance/
          if-no-files-found: ignore
