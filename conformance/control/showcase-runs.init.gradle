// Dedicated showcase instance only; retain each Loader's normal development loading.
gradle.projectsEvaluated {
    def target = System.getProperty('showcase.target')
    def directory = System.getProperty('showcase.directory')
    def port = System.getProperty('showcase.port')
    if (!(target in ['1.20.1-forge', '26.2-fabric']) || !directory || !port)
        throw new GradleException('Explicit showcase target, directory and port required')
    def candidate = gradle.rootProject.project(":versions:${target}")
    def properties = [
        'minecraft.protocol.probe.port': port,
        'minecraft.protocol.probe.disablePauseOnLostFocus': 'true',
        'minecraft.protocol.showcaseFixture': 'true',
        'minecraft.protocol.scopes': 'read,ui,input,capture,event,diagnostics,control,fixture,debug,debug.write,debug.menu'
    ]
    if (target == '26.2-fabric') {
        candidate.extensions.getByName('loom').runs.client {
            runDir = directory
            properties.each { key, value -> vmArg "-D${key}=${value}" }
        }
    } else {
        candidate.extensions.getByName('legacyForge').runs.client {
            gameDirectory = candidate.file(directory)
            properties.each { key, value -> systemProperty key, value }
        }
    }
}
